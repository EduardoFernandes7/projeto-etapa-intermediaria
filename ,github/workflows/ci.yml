name: Teste de Integração e CI

on:
  push:
    branches: [ main, entrega-intermediaria ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Validar Estrutura de Arquivos (Lint básico)
      run: |
        test -f index.html && echo "index.html existe"
        test -f app.js && echo "app.js existe"
        test -f style.css && echo "style.css existe"

    - name: Executar Teste de Integração com API ViaCEP
      run: |
        echo "Iniciando teste de integração com o serviço externo..."
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://viacep.com.br/ws/01001000/json/)
        
        if [ "$RESPONSE" -eq 200 ]; then
          echo "Sucesso! A API pública respondeu com Status 200."
        else
          echo "Falha! A API retornou status $RESPONSE"
          exit 1
        fi